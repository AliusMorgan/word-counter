<!DOCTYPE html>
<html lang="en" dir="ltr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Contact | تواصل معنا</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
:root{--bg:#f4f7f6;--card:#fff;--text:#1f2937;--primary:#2563eb}
@media (prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9}}
body{background:var(--bg);color:var(--text);padding:20px;line-height:1.8}
main{max-width:800px;margin:0 auto;background:var(--card);padding:30px;border-radius:10px}
h1{margin-bottom:15px}p{margin-bottom:12px}a{color:var(--primary)}</style></head>
<body><main><div id="en"><h1>Contact</h1><p>We would love to hear your feedback, suggestions or bug reports.</p>
<p>Email: <a href="mailto:YOUR@EMAIL.COM">YOUR@EMAIL.COM</a></p></div><div id="ar" hidden><h1>تواصل معنا</h1><p>يسعدنا سماع ملاحظاتك واقتراحاتك وأي خلل تلاحظه.</p>
<p>البريد الإلكتروني: <a href="mailto:YOUR@EMAIL.COM">YOUR@EMAIL.COM</a></p></div>
<p><a href="index.html">&larr; Home | الرئيسية</a></p></main>
<script>
var ar=false;try{var s=localStorage.getItem('lang');ar=s?s==='ar':String((navigator.languages&&navigator.languages[0])||navigator.language||'en').toLowerCase().startsWith('ar');}catch(e){}
if(ar){document.documentElement.lang='ar';document.documentElement.dir='rtl';document.getElementById('en').hidden=true;document.getElementById('ar').hidden=false;document.title=document.querySelector('#ar h1').textContent;}
</script></body></html>
